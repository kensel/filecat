[global]
	workgroup = WORKGROUP
	server string = nas3
	include = /usr/syno/etc/smb.conf.global

[Backup]
	path = /volume1/Backup
	comment = Backups
	browseable = yes
	writable = yes

[homes]
	path = /volume1/homes
	browseable = no

[Apps]
	path = /volume1/Apps
	browseable = yes

[printers]
	path = /var/spool/samba

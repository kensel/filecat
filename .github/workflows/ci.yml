name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run pytest -q

  backends:
    name: server backends
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: filecat
          POSTGRES_PASSWORD: filecat
          POSTGRES_DB: filecat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filecat" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: filecat
          MYSQL_DATABASE: filecat
          MYSQL_USER: filecat
          MYSQL_PASSWORD: filecat
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pfilecat" --health-interval 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Filecat-Test-1"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Filecat-Test-1 -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-retries 20
      mongodb:
        image: mongo:9.0
        env:
          # MongoDB 8.0+ may refuse to start on Linux 6.19+ while tcmalloc's
          # per-CPU caches are on (SERVER-121912), and the image turns them
          # on with rseq=0. rseq=1 lets glibc own rseq: per-thread caches.
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'" --health-interval 5s --health-retries 20
    env:
      FILECAT_TEST_POSTGRES: postgresql://filecat:filecat@127.0.0.1:5432/filecat
      FILECAT_TEST_MYSQL: mysql://filecat:filecat@127.0.0.1:3306/filecat
      FILECAT_TEST_MSSQL: DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;DATABASE=master;UID=sa;PWD=Filecat-Test-1;TrustServerCertificate=yes
      FILECAT_TEST_MONGODB: mongodb://127.0.0.1:27017/filecat_test
    steps:
      - uses: actions/checkout@v5
      - name: ODBC Driver 18 for SQL Server
        run: |
          if ! odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18 for SQL Server"; then
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc
          fi
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --all-extras
      - run: uv run pytest -q -rs tests/test_backend_contract.py tests/test_lease_contract.py tests/test_browse.py tests/test_config.py tests/test_mongo_rebuild.py

  smb:
    name: SMB share
    runs-on: ubuntu-latest
    services:
      samba:
        image: dockurr/samba:latest
        env:
          NAME: Data
          USER: samba
          PASS: filecat
        ports: ["445:445"]
    env:
      FILECAT_TEST_SMB: /mnt/filecat-smb
    steps:
      - uses: actions/checkout@v5
      - name: Mount the share
        run: |
          sudo apt-get update
          sudo apt-get install -y cifs-utils
          sudo mkdir -p "$FILECAT_TEST_SMB"
          for i in $(seq 1 30); do
            sudo mount -t cifs //127.0.0.1/Data "$FILECAT_TEST_SMB" \
              -o "username=samba,password=filecat,uid=$(id -u),gid=$(id -g),vers=3.0" && break
            sleep 2
          done
          mountpoint "$FILECAT_TEST_SMB"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --all-extras
      - run: uv run pytest -q -rs tests/test_smb.py

  agent:
    name: agent (Rust)
    runs-on: ubuntu-latest
    env:
      RUST_TOOLCHAIN: "1.98.0"
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: x86_64-unknown-linux-musl,armv7-unknown-linux-musleabihf,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - name: Cross compilers for the ARM builds (ring compiles a little C)
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu
      # cargo fmt is not checked: the sources are not rustfmt-formatted yet (docs/roadmap.md)
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Expected allowlist/deny hashes match src/filecat/data/agent_expected.json
        run: cargo test expected_json_matches_this_build
      - name: cargo test (native x86_64, glibc)
        run: cargo test
      - name: Build the static musl agents (x86_64, armv7, aarch64)
        run: ./build.sh all
      - name: Each artefact is statically linked; checksums
        run: |
          mkdir -p dist
          for pair in x86_64:x86_64-unknown-linux-musl armv7:armv7-unknown-linux-musleabihf aarch64:aarch64-unknown-linux-musl; do
            short=${pair%%:*}; triple=${pair#*:}
            bin="target/$triple/release/filecat-agent"
            desc=$(file -b "$bin"); echo "$short: $desc"
            echo "$desc" | grep -Eq 'statically linked|static-pie linked' || { echo "::error::$short is not static"; exit 1; }
            cp "$bin" "dist/filecat-agent-$short"
          done
          (cd dist && sha256sum filecat-agent-* | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: filecat-agent-linux-static
          path: |
            agent/dist/filecat-agent-*
            agent/dist/SHA256SUMS
          if-no-files-found: error

  agent-arm-tests:
    # The ARM unit tests run under qemu-user and take 3-4 minutes each: not on every pull request.
    name: agent tests under qemu (${{ matrix.target }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [armv7, aarch64]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: armv7-unknown-linux-musleabihf,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: arm-${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu qemu-user-static
      - run: ./build.sh test ${{ matrix.target }}

  agent-conformance:
    # The Python agent tests against the real agent (tests/_real_agent.py starts the binary directly on Linux)
    name: agent conformance (Python tests against the real agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: conformance
      - name: Build the conformance agent (feature test-root)
        id: build
        run: echo "bin=$(cd agent && ./build.sh conformance | tail -n1)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --all-extras
      - name: Python agent tests against the real agent
        env:
          FILECAT_TEST_AGENT_BIN: ${{ steps.build.outputs.bin }}
        run: >
          uv run pytest -q -rs tests/test_agent_client.py tests/test_agent_scan.py
          tests/test_rollup_privacy.py tests/test_rollup_stores.py tests/test_rollup_walk.py
          tests/test_secret_files.py tests/test_store_fs.py tests/test_synology_space.py
          tests/test_topology_collect.py

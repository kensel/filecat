[project]
name = "filecat"
version = "0.2.1"  # one version for filecat and the agent: scripts/version.py set X.Y.Z (docs/releasing.md)
description = "Walk local drives and NAS shares, record every file and directory, and measure what the bytes support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pefile>=2023.2.7",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5.0"]
mongo = ["pymongo>=4.18"]
magika = ["magika>=0.5"]
tls = ["cryptography>=42"]
dev = ["pytest>=8"]

[project.scripts]
filecat = "filecat.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filecat = ["data/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
